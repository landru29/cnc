services:
  dev:
    build: 
      context: ./dev
      dockerfile: Dockerfile
    command: sleep infinity
    privileged: true
    device_cgroup_rules: 
      - "c 188:* rmw"
      - "c 189:* rmw"
    group_add:
      - "${TTYUSB_GID:-20}"
    volumes:
      - /dev:/dev
      - ..:/workspace:cached
    environment:
      CNC_SERIAL_PORT: /tmp/ttyESP32
    depends_on: [esp32]

  esp32:
    build: 
      context: ./esp32
      dockerfile: Dockerfile
    volumes:
      - ./esp32/firmware:/firmware:ro
      - ./esp32/fs:/fs:ro
    environment:
      LFS_OFFSET: "0x3d0000"
      LFS_SIZE: "0x20000"
    expose: ["5555"]