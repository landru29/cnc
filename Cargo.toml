[package]
name = "cnc"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cnc"
path = "src/main.rs"

[[bin]]
name = "mock"
path = "src/mock/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serialport = { version = "4.6", default-features = false }
ctrlc = "3.4"
