G0: |
  ### **G0 – Rapid Positioning**
  Move to a specified position at the maximum possible speed (rapid traverse).
  **Example:** `G0 X10 Y20 Z5`

G1: |
  ### **G1 – Linear Interpolation**
  Move in a straight line to a specified position at a controlled feed rate.
  **Example:** `G1 X10 Y20 F100` (F = feed rate in mm/min or inches/min)

G2: |
  ### **G2 – Circular Interpolation (Clockwise)**
  Move in a clockwise circular arc to a specified position.
  **Example:** `G2 X10 Y20 I5 J0` (I, J = center offset from start point)

G3: |
  ### **G3 – Circular Interpolation (Counter-Clockwise)**
  Move in a counter-clockwise circular arc to a specified position.
  **Example:** `G3 X10 Y20 I5 J0`

G4: |
  ### **G4 – Dwell**
  Pause the machine for a specified amount of time (in milliseconds or seconds).
  **Example:** `G4 P1000` (Pause for 1000 milliseconds)

G10: |
  ### **G10 – Set Workspace Coordinate Offset**
  Set a workspace coordinate system offset.
  **Example:** `G10 L2 P1 X10 Y20` (L2 = workspace, P1 = coordinate system index)

G17: |
  ### **G17 – XY Plane Selection**
  Select the XY plane for circular interpolation (G2/G3).
  **Example:** `G17`

G18: |
  ### **G18 – XZ Plane Selection**
  Select the XZ plane for circular interpolation (G2/G3).
  **Example:** `G18`

G19: |
  ### **G19 – YZ Plane Selection**
  Select the YZ plane for circular interpolation (G2/G3).
  **Example:** `G19`

G20: |
  ### **G20 – Units in Inches**
  Set the unit system to inches.
  **Example:** `G20`

G21: |
  ### **G21 – Units in Millimeters**
  Set the unit system to millimeters.
  **Example:** `G21`

G28: |
  ### **G28 – Return to Home**
  Move the machine to its home position (as defined by homing switches).
  **Example:** `G28`

G30: |
  ### **G30 – Return to Secondary Home**
  Move the machine to a secondary home position (if configured).
  **Example:** `G30`

G38.2: |
  ### **G38.2 – Probe Toward Workpiece**
  Probe toward the workpiece until contact is detected.
  **Example:** `G38.2 Z-10 F10`

G38.3: |
  ### **G38.3 – Probe Away from Workpiece**
  Probe away from the workpiece until contact is lost.
  **Example:** `G38.3 Z10 F10`

G40: |
  ### **G40 – Cutter Radius Compensation Off**
  Disable cutter radius compensation.
  **Example:** `G40`

G43: |
  ### **G43 – Tool Length Offset (Positive)**
  Apply a positive tool length offset.
  **Example:** `G43 H1` (H1 = tool offset index)

G49: |
  ### **G49 – Tool Length Offset Cancel**
  Cancel tool length offset.
  **Example:** `G49`

G53: |
  ### **G53 – Move in Absolute Coordinates**
  Move in absolute machine coordinates (ignoring work offsets).
  **Example:** `G53 G0 X10 Y20`

G54: |
  ### **G54 – Work Coordinate System 1**
  Select work coordinate system 1 (WCS1).
  **Example:** `G54`

G55: |
  ### **G55 – Work Coordinate System 2**
  Select work coordinate system 2 (WCS2).
  **Example:** `G55`

G56: |
  ### **G56 – Work Coordinate System 3**
  Select work coordinate system 3 (WCS3).
  **Example:** `G56`

G57: |
  ### **G57 – Work Coordinate System 4**
  Select work coordinate system 4 (WCS4).
  **Example:** `G57`

G58: |
  ### **G58 – Work Coordinate System 5**
  Select work coordinate system 5 (WCS5).
  **Example:** `G58`

G59: |
  ### **G59 – Work Coordinate System 6**
  Select work coordinate system 6 (WCS6).
  **Example:** `G59`

G61: |
  ### **G61 – Exact Path Mode**
  Enable exact path mode (default in GRBL).
  **Example:** `G61`

G64: |
  ### **G64 – Continuous Path Mode**
  Enable continuous path mode (smoother motion at corners).
  **Example:** `G64`

G80: |
  ### **G80 – Cancel Motion Mode**
  Cancel any active motion mode (e.g., canned cycles).
  **Example:** `G80`

G90: |
  ### **G90 – Absolute Positioning**
  Set positioning to absolute coordinates.
  **Example:** `G90`

G91: |
  ### **G91 – Relative Positioning**
  Set positioning to relative coordinates (incremental).
  **Example:** `G91`

G92: |
  ### **G92 – Set Position**
  Set the current position to a specified coordinate.
  **Example:** `G92 X0 Y0 Z0`

G93: |
  ### **G93 – Inverse Time Feed Rate Mode**
  Set feed rate in inverse time mode (rarely used in GRBL).
  **Example:** `G93 F10`

G94: |
  ### **G94 – Feed Rate Mode (Units per Minute)**
  Set feed rate mode to units per minute (default in GRBL).
  **Example:** `G94`

M0: |
  ### **M0 – Program Pause**
  Pause the program until the user resumes it.
  **Example:** `M0`

M2: |
  ### **M2 – Program End**
  End the program and reset the machine.
  **Example:** `M2`

M3: |
  ### **M3 – Spindle Start (Clockwise)**
  Start the spindle in a clockwise direction.
  **Example:** `M3 S1000` (S = spindle speed in RPM)

M4: |
  ### **M4 – Spindle Start (Counter-Clockwise)**
  Start the spindle in a counter-clockwise direction.
  **Example:** `M4 S1000`

M5: |
  ### **M5 – Spindle Stop**
  Stop the spindle.
  **Example:** `M5`

M6: |
  ### **M6 – Tool Change**
  Change the tool (if supported by the machine).
  **Example:** `M6 T1` (T1 = tool number)

M7: |
  ### **M7 – Mist Coolant On**
  Turn on mist coolant.
  **Example:** `M7`

M8: |
  ### **M8 – Flood Coolant On**
  Turn on flood coolant.
  **Example:** `M8`

M9: |
  ### **M9 – Coolant Off**
  Turn off all coolant.
  **Example:** `M9`

M30: |
  ### **M30 – Program End and Reset**
  End the program and reset the machine (similar to M2 but often includes a reset).
  **Example:** `M30`

M100: |
  ### **M100 – Custom Macro (User-Defined)**
  Execute a custom macro (if defined in GRBL).
  **Example:** `M100`

M114: |
  ### **M114 – Get Current Position**
  Report the current machine position.
  **Example:** `M114`

M119: |
  ### **M119 – Get Limit Switch States**
  Report the state of the limit switches.
  **Example:** `M119`

"$": |
  ### **$ – GRBL Settings**
  View or modify GRBL settings.
  **Example:**
  - `$` – List all settings.
  - `$0=10` – Set setting 0 to 10.
  - `$#` – View GRBL parameters (e.g., workspace offsets).

"$$": |
  ### **$$ – View GRBL Settings**
  Display all current GRBL settings.
  **Example:** `$$`

"$G": |
  ### **$G – View G-Code Parser State**
  Display the current G-code parser state (e.g., active modal groups).
  **Example:** `$G`

"$I": |
  ### **$I – View GRBL Build Info**
  Display GRBL version and build information.
  **Example:** `$I`

"$N": |
  ### **$N – View Startup Blocks**
  Display the startup blocks (G-code commands executed at power-up).
  **Example:** `$N`

"$C": |
  ### **$C – Check G-Code**
  Check the G-code in the buffer for errors without executing it.
  **Example:** `$C`

"$X": |
  ### **$X – Reset GRBL**
  Reset GRBL (similar to power-cycling).
  **Example:** `$X`

"$H": |
  ### **$H – Homing Cycle**
  Perform a homing cycle to find the machine's home position.
  **Example:** `$H`

"$J": |
  ### **$J – Jogging**
  Jog the machine in a specified direction.
  **Example:** `$J=G91 X10 F100` (Jog 10mm in X at 100mm/min)

"$RST": |
  ### **$RST – Reset GRBL**
  Reset GRBL to its default state.
  **Example:** `$RST`

"$SLP": |
  ### **$SLP – Sleep Mode**
  Put GRBL into sleep mode (if supported).
  **Example:** `$SLP`

"~": |
  ### **~ – Resume from Hold**
  Resume a paused program (e.g., after a feed hold).
  **Example:** `~`

"!": |
  ### **! – Feed Hold**
  Pause the current operation (feed hold).
  **Example:** `!`

"?": |
  ### **? – Current Status**
  Request the current status of GRBL (e.g., "Idle", "Run", "Hold").
  **Example:** `?`