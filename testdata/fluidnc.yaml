        $Telnet/Port=23
        $HTTP/BlockDuringMotion=ON
        $HTTP/Enable=ON
        $MDNS/Enable=ON
        $NTP/Enable=OFF
        $Sta/MinSecurity=WPA2-PSK
        $WiFi/FastScan=OFF
