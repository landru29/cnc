        $AP/Country=01
        $AP/Channel=1
        $network/type=WiFi
        $Hostname=fluidnc
        $Config/Filename=config.yaml
        ok
  - when: $F
    then:
      - |
        $Grbl/SoftLimitsEnable=0
        $Notification/Type=NONE
        $Notification/T1=
        $Notification/T2=
        $Notification/TS=
        $WiFi/PsMode=None
        $WiFi/Mode=STA>AP
        $WiFi/FastScan=OFF
        $Firmware/Build=
        $SD/FallbackCS=-1
        $Config/Filename=config.yaml
        ok
  - when: 0x18
    then:
      - Grbl 4.1 [FluidNC v4.1.1 (esp32-wifi) '$' for help]